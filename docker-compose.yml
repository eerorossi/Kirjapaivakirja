services:
  kirjapaivakirja:
    build: .
    container_name: kirjapaivakirja
    restart: unless-stopped
    init: true
    ports:
      # Sovellus luottaa Authelian headereihin: rajaa portti palomuurilla
      # vain Caddyn osoitteesta tai sido se tiettyyn osoitteeseen (BIND_ADDR).
      - "${BIND_ADDR:-0.0.0.0}:8097:8097"
    environment:
      DB_PATH: /app/data/kirjapaivakirja.db
      COVERS_DIR: /app/data/covers
      BACKUP_DIR: /app/data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      AUTH_EMAIL_HEADER: Remote-Email
      AUTH_NAME_HEADER: Remote-Name
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
