<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirjapäiväkirja</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; margin-inline: auto; }
    h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>Kirjapäiväkirja</h1>
  <p id="greeting">Ladataan…</p>
  <script>
    // Suhteelliset polut toimivat myös Caddyn polkuprefiksin (/kp) takana.
    fetch("api/me")
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(me => { document.getElementById("greeting").textContent = "Hei, " + me.display_name + "!"; })
      .catch(() => { document.getElementById("greeting").textContent = "Kirjautuminen epäonnistui."; });
  </script>
</body>
</html>
